[package]
name = "jsonviewer"
version = "1.0.1"
edition = "2024"
description = "Visor de JSON ligero: texto formateado, árbol plegable/compacto y tabla"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "links"] }
egui_extras = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
similar = "3.2.0"
lucide-icons = "1.56"
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"
